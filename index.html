<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catamaran Hunt</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mute:#6b7785;--line:#e3e8ee;--accent:#0b6e99;--good:#1f8a4c;--warn:#b7791f;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#0b3d5c,#0b6e99);color:#fff;padding:18px 28px}
header h1{margin:0;font-size:22px;font-weight:650}header .sub{opacity:.85;font-size:13px;margin-top:3px}
.wrap{padding:18px 28px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:140px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:12px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;gap:4px}
.filters input[type=number]{width:96px}.filters input,.filters select{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.filters .chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--ink);letter-spacing:0}
.filters button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#eef2f6;font-size:12px;color:#44515f;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0}
th.sorted:after{content:" \25BE"}th.sorted.asc:after{content:" \25B4"}
tr.boat:hover{background:#f8fbfd}tr.boat{cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.boatname{font-weight:600}.mute{color:var(--mute);font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin:2px 3px 0 0;white-space:nowrap}
.b-new{background:#e3f2fd;color:#0b5394}.b-drop{background:#e6f4ea;color:var(--good)}.b-stale{background:#fdf2e0;color:var(--warn)}
.b-uc{background:#fde8e6;color:var(--bad)}.b-sold,.b-removed{background:#eceff1;color:#555}.b-watch{background:#fff4c2;color:#7a5d00}
.b-vet{background:#e0f2f1;color:#00695c}.b-maybe{background:#f1ecfb;color:#5b3fa0}.b-excl{background:#eceff1;color:#666}.b-target{background:#e6f4ea;color:var(--good)}.b-unc{background:#fff0e0;color:#a35a00}
.links a{display:inline-block;margin:1px 6px 1px 0;color:var(--accent);text-decoration:none;font-size:12px}.links a:hover{text-decoration:underline}
tr.detail td{background:#fbfcfd;font-size:13px}tr.detail table{border:none;border-radius:0;background:transparent}
tr.detail th{position:static;background:transparent;cursor:default}
.price{font-weight:650}.under{color:var(--good)}
svg.spark{display:block}
.empty{padding:30px;text-align:center;color:var(--mute)}
footer{color:var(--mute);font-size:12px;padding:6px 28px 24px}
</style></head><body>
<header><h1>Performance Catamaran Hunt</h1>
<div class="sub" id="sub"></div></header>
<div class="wrap">
<div class="stats" id="stats"></div>
<div class="filters">
 <label>Min price $<input type="number" id="pmin" step="25000" placeholder="0"></label>
 <label>Max price $<input type="number" id="pmax" step="25000" value="750000"></label>
 <label>Min length ft<input type="number" id="lmin" value="37"></label>
 <label>Max length ft<input type="number" id="lmax" placeholder="any"></label>
 <label>Coast<select id="coast"><option value="">All</option></select></label>
 <label>Builder<select id="builder"><option value="">All</option></select></label>
 <label>Status<select id="status"><option value="live">Active + under contract</option><option value="">All</option><option>active</option><option>under contract</option><option>stale</option><option>sold</option><option>removed</option></select></label>
 <label>Search<input type="text" id="q" placeholder="name, model, place"></label>
 <label class="chk"><input type="checkbox" id="under"> Under target only</label>
 <label class="chk"><input type="checkbox" id="watch"> Watchlist only</label>
 <label class="chk"><input type="checkbox" id="excl"> Show excluded</label>
 <button id="reset">Reset</button>
</div>
<table><thead><tr>
 <th data-k="name">Boat</th><th data-k="year">Year</th><th data-k="len">Length</th><th data-k="price" class="sorted asc">Price</th>
 <th data-k="trend">Price history</th><th data-k="loc">Location</th><th data-k="coast">Coast</th><th data-k="status">Status</th><th>Sources</th>
</tr></thead><tbody id="rows"></tbody></table>
</div>
<footer>Click a row for listing details and notes. Data: data/boats.csv, listings.csv, price_history.csv. Feedback goes in feedback/feedback.csv (like / dislike / watch / ignore).</footer>

const $=id=>document.getElementById(id);
const fmt=n=>n==null?'':'$'+n.toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sortK='price',asc=true,open=new Set();
const boats=DATA.boats;
$('sub').textContent=`Daggerboard sailing cats, 37 ft+ (ideal ~45), target under $500k, ceiling $750k, US East/West Coast. Data as of ${DATA.run}. Updated by Bob, ${DATA.built} ET.`;
[...new Set(boats.map(b=>b.coast).filter(Boolean))].sort().forEach(c=>$('coast').add(new Option(c,c)));
[...new Set(boats.filter(b=>b.crit!=='excluded').map(b=>b.builder))].sort().forEach(c=>$('builder').add(new Option(c,c)));
function spark(s,w=120,h=30){
 if(!s.length)return '<span class="mute">no data</span>';
 const ps=s.map(x=>x[1]);if(s.length===1)return `<span class="mute" style="white-space:nowrap">1 price point (${s[0][0].slice(5)})</span>`;
 const t=s.map(x=>Date.parse(x[0])),t0=Math.min(...t),t1=Math.max(...t)||t0+1,lo=Math.min(...ps),hi=Math.max(...ps),r=(hi-lo)||1;
 const X=v=>4+(w-8)*(t1===t0?0.5:(v-t0)/(t1-t0)),Y=v=>h-4-(h-8)*(v-lo)/r;
 const pts=s.map((x,i)=>X(t[i]).toFixed(1)+','+Y(ps[i]).toFixed(1)).join(' ');
 const col=ps[ps.length-1]<ps[0]?'#1f8a4c':ps[ps.length-1]>ps[0]?'#c0392b':'#0b6e99';
 return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><title>${s.map(x=>x[0]+': '+fmt(x[1])).join('\n')}</title><polyline fill="none" stroke="${col}" stroke-width="2" points="${pts}"/>${s.map((x,i)=>`<circle cx="${X(t[i]).toFixed(1)}" cy="${Y(ps[i]).toFixed(1)}" r="2.2" fill="${col}"/>`).join('')}</svg><div class="mute">${fmt(ps[0])} &rarr; ${fmt(ps[ps.length-1])}</div>`;
}
function badges(b){let o='';
 if(b.watch)o+='<span class="badge b-watch">&#9733; Watch</span>';
 if(b.bsrc==='boat')o+=`<span class="badge b-vet" title="Boards vetted for this boat: ${esc(b.bv)}${b.bchk?' ('+esc(b.bchk)+')':''}">&#10003; Vetted</span>`;
 else if(b.bsrc==='model')o+=`<span class="badge b-vet" title="Boards vetted at model level: ${esc(b.bv)}${b.bchk?' ('+esc(b.bchk)+')':''}">&#10003; Vetted (model)</span>`;
 if(b.new)o+='<span class="badge b-new">New</span>';
 if(b.drop)o+=`<span class="badge b-drop">&darr; ${fmt(b.drop)}</span>`;
 if(b.under&&b.crit!=='excluded'&&b.status==='active')o+='<span class="badge b-target">Under target</span>';
 if(b.status==='stale')o+='<span class="badge b-stale">Stale ad</span>';
 if(b.status==='under contract')o+='<span class="badge b-uc">Under contract</span>';
 if(b.status==='sold'||b.status==='removed')o+=`<span class="badge b-${b.status}">${b.status}</span>`;
 if(b.crit==='maybe')o+=`<span class="badge b-maybe" title="${esc(b.critNotes)}">Maybe: ${esc(b.critNotes)}</span>`;
 if(b.crit==='excluded')o+=`<span class="badge b-excl">Excluded: ${esc(b.critNotes)}</span>`;
 if(b.conflict)o+='<span class="badge b-unc" title="Different sites show different prices; open the row for details">Prices differ</span>';
 if(b.uncertain)o+='<span class="badge b-unc" title="Merged on builder/model/year/location only">Uncertain merge</span>';
 if(b.feedback)o+=`<span class="badge b-excl">${esc(b.feedback)}</span>`;
 return o;}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim());
function boardsInfo(b){
 if(!b.bv)return `<b>Daggerboards:</b> ${esc(b.boards)} <span class="mute">(scout-reported, not vetted)</span>`;
 const src=b.bsrc==='boat'?'boat vetted':'model-level vetting';
 const ev=b.bev?(safeUrl(b.bev)?` &middot; <a href="${esc(b.bev)}" target="_blank" rel="noopener">evidence (${esc(host(b.bev))})</a>`:` &middot; evidence: ${esc(b.bev)}`):' &middot; <span class="mute">no evidence link</span>';
 return `<b>Boards:</b> ${esc(b.bv)} <span class="mute">(${src}${b.bchk?', checked '+esc(b.bchk):''}; daggerboards field: ${esc(b.boards)})</span>${ev}${b.bnotes?` &middot; <span class="mute">${esc(b.bnotes)}</span>`:''}`;}
function filtered(){
 const pmin=+$('pmin').value||0,pmax=+$('pmax').value||Infinity,lmin=+$('lmin').value||0,lmax=+$('lmax').value||Infinity,
  coast=$('coast').value,bld=$('builder').value,st=$('status').value,q=$('q').value.toLowerCase();
 return boats.filter(b=>{
  if(!$('excl').checked&&(b.crit==='excluded'||b.feedback==='ignore'))return false;
  if(b.price!=null&&(b.price<pmin||b.price>pmax))return false;
  if(b.len!=null&&(b.len<lmin||b.len>lmax))return false;
  if(coast&&b.coast!==coast)return false; if(bld&&b.builder!==bld)return false;
  if(st==='live'&&!['active','under contract'].includes(b.status))return false;
  if(st&&st!=='live'&&b.status!==st)return false;
  if($('under').checked&&!b.under)return false; if($('watch').checked&&!b.watch)return false;
  if(q&&!(b.builder+' '+b.model+' '+b.name+' '+b.loc+' '+b.id).toLowerCase().includes(q))return false;
  return true;});}
function val(b,k){if(k==='name')return (b.builder+' '+b.model+' '+b.name).toLowerCase();if(k==='trend')return b.drop||0;return b[k]??(asc?Infinity:-Infinity);}
function render(){
 const list=filtered().sort((a,b)=>{const x=val(a,sortK),y=val(b,sortK);return (x<y?-1:x>y?1:0)*(asc?1:-1)});
 const live=boats.filter(b=>b.crit!=='excluded'&&b.status==='active'&&b.price);
 $('stats').innerHTML=[[list.length,'shown'],[live.filter(b=>b.price<500000).length,'active under $500k'],[live.filter(b=>b.price<=750000).length,'active up to $750k'],
  [boats.filter(b=>b.drop&&b.crit!=='excluded').length,'with price drops'],[boats.filter(b=>b.status==='stale'&&b.crit!=='excluded').length,'stale private ads'],[boats.filter(b=>b.watch).length,'on watchlist']]
  .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
 let h='';
 for(const b of list){
  const title=`${esc(b.builder)} ${esc(b.model)}${b.name?' <span class="mute">&ldquo;'+esc(b.name)+'&rdquo;</span>':''}`;
  const links=b.listings.filter(l=>l.url).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.status)} ${l.price?fmt(+l.price):''}">${esc(l.site)}</a>`).join('');
  h+=`<tr class="boat" data-id="${esc(b.id)}"><td><div class="boatname">${title}</div><div>${badges(b)}</div></td><td class="num">${b.year??''}</td><td class="num">${b.len?b.len.toFixed(1).replace(/\.0$/,'')+' ft':''}</td>
  <td class="num"><span class="price ${b.under?'under':''}">${fmt(b.price)}</span>${b.psite?'<div class="mute">'+esc(b.psite)+'</div>':''}</td><td>${spark(b.series)}</td>
  <td>${esc(b.loc)}</td><td>${esc(b.coast)}</td><td>${esc(b.status)}</td><td class="links">${links}</td></tr>`;
  if(open.has(b.id)){
   h+=`<tr class="detail"><td colspan="9"><table><tr><th>Site</th><th>Price</th><th>Status</th><th>Ad posted</th><th>Last checked</th><th>Link</th></tr>${b.listings.map(l=>`<tr><td>${esc(l.site)}</td><td class="num">${l.price?fmt(+l.price):''}</td><td>${esc(l.status)}${l.stale?' (stale)':''}</td><td>${esc(l.posted)}</td><td>${esc(l.checked)}</td><td class="links">${l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(host(l.url))}</a>`:'<span class="mute">'+esc(l.key)+'</span>'}</td></tr>`).join('')}</table>
   <p><b>Boat ID:</b> <code>${esc(b.id)}</code> &middot; ${boardsInfo(b)} &middot; <b>First seen:</b> ${esc(b.first)} &middot; <b>Last seen live:</b> ${esc(b.last)}</p>
   ${b.notes?`<p><b>Notes:</b> ${esc(b.notes)}</p>`:''}${b.details?`<p class="mute"><b>Listing details:</b> ${esc(b.details)}</p>`:''}</td></tr>`;}
 }
 $('rows').innerHTML=h||'<tr><td colspan="9" class="empty">No boats match these filters.</td></tr>';
}
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;asc=sortK===k?!asc:true;sortK=k;
 document.querySelectorAll('th').forEach(x=>x.classList.remove('sorted','asc'));th.classList.add('sorted');if(asc)th.classList.add('asc');render();});
$('rows').onclick=e=>{if(e.target.closest('a'))return;const tr=e.target.closest('tr.boat');if(!tr)return;const id=tr.dataset.id;open.has(id)?open.delete(id):open.add(id);render();};
document.querySelectorAll('.filters input,.filters select').forEach(x=>x.addEventListener('input',render));
$('reset').onclick=()=>{$('pmin').value='';$('pmax').value=750000;$('lmin').value=37;$('lmax').value='';['coast','builder','q'].forEach(i=>$(i).value='');$('status').value='live';['under','watch','excl'].forEach(i=>$(i).checked=false);render();};
render();
</script></body></html>
